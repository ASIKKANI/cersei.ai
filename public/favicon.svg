<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Lightning / Circuit Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0ea5e9" flood-opacity="0.45" />
    </filter>
    
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.3" stroke-dasharray="16 8" />

  <!-- Stylized Geometric "C" Arc (Cersei Circuit) -->
  <path
    d="M 330 145 C 210 120 125 190 125 256 C 125 322 210 392 330 367"
    fill="none"
    stroke="url(#boltGrad)"
    stroke-width="36"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- High-Energy Lightning Spear Core (The AI Engine) -->
  <path
    d="M 285 110 L 215 245 L 290 245 L 225 402 L 345 225 L 270 225 Z"
    fill="url(#boltGrad)"
    filter="url(#glow)"
  />

  <!-- Neural Connection Nodes -->
  <circle cx="330" cy="145" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="330" cy="367" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="125" cy="256" r="10" fill="#bae6fd" />

  <!-- Center Core Pulsing Dot -->
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>